<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航中心 - 赛博朋克风格</title>
    <style>
        /* ============ 全局重置与基础样式 ============ */
        :root {
            --neon-cyan: #00f0ff;
            --neon-pink: #ff00e5;
            --neon-purple: #8b5cf6;
            --neon-green: #39ff14;
            --neon-gold: #ffd700;
            --glass-bg: rgba(10, 15, 30, 0.75);
            --glass-border: rgba(0, 240, 255, 0.3);
            --glass-border-hover: rgba(0, 240, 255, 0.7);
            --text-primary: #e0e8ff;
            --text-secondary: #8899cc;
            --text-glow: #00f0ff;
            --card-shadow: 0 0 30px rgba(0, 240, 255, 0.15), 0 0 60px rgba(255, 0, 229, 0.08);
            --font-mono: 'Courier New', 'Fira Code', 'Consolas', monospace;
            --font-display: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050810;
            font-family: var(--font-display);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============ 粒子画布 ============ */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ============ 背景网格 ============ */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-pulse 4s ease-in-out infinite;
        }

        @keyframes grid-pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ============ 扫描线效果 ============ */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 240, 255, 0.015) 2px,
                    rgba(0, 240, 255, 0.015) 4px);
        }

        /* ============ 主容器 ============ */
        .main-container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 960px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============ 标题区域 ============ */
        .header-section {
            text-align: center;
            position: relative;
            width: 100%;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .title-icon {
            width: 52px;
            height: 52px;
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.15);
            animation: icon-float 3s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .title-icon:hover {
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.7), inset 0 0 25px rgba(0, 240, 255, 0.3);
            transform: scale(1.08);
        }

        @keyframes icon-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .main-title {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-pink) 50%, var(--neon-purple) 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5));
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-top: 6px;
            font-family: var(--font-mono);
            opacity: 0.8;
            position: relative;
        }

        .subtitle::before,
        .subtitle::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan));
        }
        .subtitle::before { left: 15%; }
        .subtitle::after { right: 15%; transform: scaleX(-1); }

        /* ============ 状态指示器 ============ */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--neon-green);
            box-shadow: 0 0 12px var(--neon-green), 0 0 25px var(--neon-green);
            animation: dot-blink 1.5s ease-in-out infinite;
        }

        @keyframes dot-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }

        .status-text {
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* ============ 导航卡片网格 ============ */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
        }

        /* ============ 玻璃卡片 ============ */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--glass-border);
            border-radius: 20px;
            padding: 28px 24px;
            position: relative;
            box-shadow: var(--card-shadow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
            cursor: pointer;
        }

        .glass-card:hover {
            border-color: var(--glass-border-hover);
            box-shadow: 0 0 45px rgba(0, 240, 255, 0.25), 0 0 80px rgba(255, 0, 229, 0.12), inset 0 0 30px rgba(0, 240, 255, 0.05);
            transform: translateY(-5px);
        }

        /* 卡片边角装饰 */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 35px;
            height: 35px;
            border-top: 3px solid var(--neon-cyan);
            border-left: 3px solid var(--neon-cyan);
            border-radius: 20px 0 0 0;
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        .glass-card::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 35px;
            height: 35px;
            border-bottom: 3px solid var(--neon-pink);
            border-right: 3px solid var(--neon-pink);
            border-radius: 0 0 20px 0;
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        .glass-card:hover::before {
            width: 55px;
            height: 55px;
            opacity: 1;
        }
        .glass-card:hover::after {
            width: 55px;
            height: 55px;
            opacity: 1;
        }

        /* 卡片图标 */
        .card-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.6));
            transition: all 0.3s ease;
            animation: icon-pulse 2s ease-in-out infinite;
        }

        @keyframes icon-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        .glass-card:hover .card-icon {
            filter: drop-shadow(0 0 18px rgba(0, 240, 255, 0.9));
            transform: scale(1.15);
        }

        /* 卡片标题 */
        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text-primary);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
            transition: all 0.3s ease;
        }

        .glass-card:hover .card-title {
            color: var(--neon-cyan);
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
        }

        /* 卡片描述 */
        .card-desc {
            font-size: 0.78rem;
            color: var(--text-secondary);
            letter-spacing: 0.08em;
            line-height: 1.5;
            font-family: var(--font-mono);
            transition: all 0.3s ease;
        }

        .glass-card:hover .card-desc {
            color: #aabbdd;
        }

        /* 卡片链接提示 */
        .card-hint {
            margin-top: auto;
            font-size: 0.7rem;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .glass-card:hover .card-hint {
            opacity: 1;
            color: var(--neon-cyan);
        }

        .card-hint::after {
            content: '→';
            transition: transform 0.3s ease;
        }

        .glass-card:hover .card-hint::after {
            transform: translateX(4px);
        }

        /* ============ 底部提示 ============ */
        .footer-note {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-align: center;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }
        .footer-note:hover {
            opacity: 1;
        }

        /* ============ 加载状态 ============ */
        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            font-size: 0.85rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 240, 255, 0.15);
            border-top-color: var(--neon-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============ 响应式设计 ============ */
        @media (max-width: 480px) {
            .glass-card {
                padding: 22px 18px;
                border-radius: 15px;
            }
            .glass-card::before,
            .glass-card::after {
                width: 25px;
                height: 25px;
                border-radius: 15px 0 0 0;
            }
            .glass-card::after {
                border-radius: 0 0 15px 0;
            }
            .nav-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .subtitle::before,
            .subtitle::after {
                width: 20px;
            }
            .main-container {
                margin: 24px auto;
                gap: 24px;
            }
        }

        @media (min-width: 768px) {
            .glass-card {
                padding: 32px 28px;
            }
        }
    </style>
</head>
<body>

    <!-- 背景粒子画布 -->
    <canvas id="particles-canvas"></canvas>

    <!-- 网格背景 -->
    <div class="grid-overlay"></div>

    <!-- 扫描线 -->
    <div class="scanline"></div>

    <!-- 主内容 -->
    <div class="main-container">
        <!-- 标题区域 -->
        <header class="header-section">
            <div class="title-wrapper">
                <div class="title-icon">🧭</div>
                <h1 class="main-title">导航中心</h1>
            </div>
            <p class="subtitle">Navigation Hub</p>
            <div class="status-bar">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusText">系统就绪</span>
            </div>
        </header>

        <!-- 导航卡片网格 -->
        <div class="nav-grid" id="navGrid">
            <div class="loading-state" id="loadingState">
                <div class="loading-spinner"></div>
                <div>正在加载导航数据...</div>
            </div>
        </div>

        <!-- 底部提示 -->
        <p class="footer-note">
            ⚡ 数据驱动 &nbsp;|&nbsp; 实时加载 &nbsp;|&nbsp; 赛博朋克风格
        </p>
    </div>

    <script>
        (function() {
            'use strict';

            // ============ DOM 元素引用 ============
            const elements = {
                navGrid: document.getElementById('navGrid'),
                loadingState: document.getElementById('loadingState'),
                statusDot: document.getElementById('statusDot'),
                statusText: document.getElementById('statusText')
            };

            // ============ 配置 ============
            const CONFIG = {
                dataUrl: 'list.json'  // JSON 数据文件路径
            };

            // ============ 工具函数 ============
            function setStatus(text, type) {
                elements.statusText.textContent = text;
                elements.statusDot.className = 'status-dot';
                if (type === 'loading') elements.statusDot.classList.add('loading');
                if (type === 'error') elements.statusDot.classList.add('error');
            }

            // ============ 渲染卡片 ============
            function renderCards(data) {
                // 移除加载状态
                if (elements.loadingState) {
                    elements.loadingState.remove();
                }

                const cards = data.links || [];

                if (cards.length === 0) {
                    elements.navGrid.innerHTML = `
                        <div class="loading-state">
                            <div>暂无导航数据</div>
                        </div>
                    `;
                    setStatus('暂无数据', 'error');
                    return;
                }

                // 清空网格
                elements.navGrid.innerHTML = '';

                // 逐个创建卡片
                cards.forEach(function(item) {
                    const card = document.createElement('a');
                    card.className = 'glass-card';
                    card.href = item.url;
                    card.target = '_self';
                    card.rel = 'noopener noreferrer';

                    // 图标
                    const icon = document.createElement('div');
                    icon.className = 'card-icon';
                    icon.textContent = item.icon || '🔗';
                    card.appendChild(icon);

                    // 标题
                    const title = document.createElement('div');
                    title.className = 'card-title';
                    title.textContent = item.name || '未命名';
                    card.appendChild(title);

                    // 描述
                    if (item.description) {
                        const desc = document.createElement('div');
                        desc.className = 'card-desc';
                        desc.textContent = item.description;
                        card.appendChild(desc);
                    }

                    // 链接提示
                    const hint = document.createElement('div');
                    hint.className = 'card-hint';
                    hint.textContent = '访问';
                    card.appendChild(hint);

                    elements.navGrid.appendChild(card);
                });

                setStatus('就绪 · ' + cards.length + ' 个节点', 'ready');
            }

            // ============ 加载数据 ============
            async function loadData() {
                try {
                    setStatus('正在加载...', 'loading');

                    const response = await fetch(CONFIG.dataUrl);

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} - 无法加载 ${CONFIG.dataUrl}`);
                    }

                    const data = await response.json();
                    renderCards(data);

                } catch (error) {
                    console.error('导航数据加载失败:', error);

                    // 显示错误状态
                    if (elements.loadingState) {
                        elements.loadingState.innerHTML = `
                            <div>⚠ 加载失败</div>
                            <div style="margin-top:8px;font-size:0.75rem;opacity:0.7;">
                                ${error.message}
                            </div>
                        `;
                    }
                    setStatus('加载失败', 'error');
                }
            }

            // ============ 初始化粒子背景 ============
            function initParticles() {
                const canvas = document.getElementById('particles-canvas');
                const ctx = canvas.getContext('2d');
                let particles = [];
                const PARTICLE_COUNT = 60;

                function resize() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }

                function createParticles() {
                    particles = [];
                    for (let i = 0; i < PARTICLE_COUNT; i++) {
                        particles.push({
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height,
                            vx: (Math.random() - 0.5) * 0.4,
                            vy: (Math.random() - 0.5) * 0.4,
                            radius: Math.random() * 1.5 + 0.5,
                            alpha: Math.random() * 0.5 + 0.1
                        });
                    }
                }

                function draw() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    particles.forEach(function(p) {
                        p.x += p.vx;
                        p.y += p.vy;

                        if (p.x < 0) p.x = canvas.width;
                        if (p.x > canvas.width) p.x = 0;
                        if (p.y < 0) p.y = canvas.height;
                        if (p.y > canvas.height) p.y = 0;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(0, 240, 255, ' + p.alpha + ')';
                        ctx.fill();
                    });

                    // 粒子之间的连线
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);

                            if (dist < 130) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = 'rgba(0, 240, 255, ' + (0.08 * (1 - dist / 130)) + ')';
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        }
                    }

                    requestAnimationFrame(draw);
                }

                resize();
                createParticles();
                draw();

                window.addEventListener('resize', function() {
                    resize();
                    createParticles();
                });
            }

            // ============ 启动 ============
            function init() {
                initParticles();
                loadData();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
