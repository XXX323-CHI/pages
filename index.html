<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP 探测器 - 赛博朋克风格</title>
    <style>
        /* ============ 全局重置与基础样式 ============ */
        :root {
            --neon-cyan: #00f0ff;
            --neon-pink: #ff00e5;
            --neon-purple: #8b5cf6;
            --neon-green: #39ff14;
            --neon-gold: #ffd700;
            --glass-bg: rgba(10, 15, 30, 0.75);
            --glass-border: rgba(0, 240, 255, 0.3);
            --glass-border-hover: rgba(0, 240, 255, 0.7);
            --text-primary: #e0e8ff;
            --text-secondary: #8899cc;
            --text-glow: #00f0ff;
            --card-shadow: 0 0 30px rgba(0, 240, 255, 0.15), 0 0 60px rgba(255, 0, 229, 0.08);
            --font-mono: 'Courier New', 'Fira Code', 'Consolas', monospace;
            --font-display: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050810;
            font-family: var(--font-display);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============ 粒子画布 ============ */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ============ 背景网格 ============ */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: grid-pulse 4s ease-in-out infinite;
        }

        @keyframes grid-pulse {
            0%,
            100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* ============ 扫描线效果 ============ */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 240, 255, 0.015) 2px,
                    rgba(0, 240, 255, 0.015) 4px);
        }

        /* ============ 主容器 ============ */
        .main-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 620px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============ 标题区域 ============ */
        .header-section {
            text-align: center;
            position: relative;
            width: 100%;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .title-icon {
            width: 52px;
            height: 52px;
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.15);
            animation: icon-float 3s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .title-icon:hover {
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.7), inset 0 0 25px rgba(0, 240, 255, 0.3);
            transform: scale(1.08);
        }

        @keyframes icon-float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .main-title {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 900;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-pink) 50%, var(--neon-purple) 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s ease-in-out infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5));
        }

        @keyframes gradient-shift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-top: 6px;
            font-family: var(--font-mono);
            opacity: 0.8;
            position: relative;
        }

        .subtitle::before,
        .subtitle::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan));
        }
        .subtitle::before {
            left: 15%;
        }
        .subtitle::after {
            right: 15%;
            transform: scaleX(-1);
        }

        /* ============ 状态指示器 ============ */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--neon-green);
            box-shadow: 0 0 12px var(--neon-green), 0 0 25px var(--neon-green);
            animation: dot-blink 1.5s ease-in-out infinite;
        }

        .status-dot.loading {
            background: var(--neon-gold);
            box-shadow: 0 0 12px var(--neon-gold), 0 0 25px var(--neon-gold);
            animation: dot-blink 0.6s ease-in-out infinite;
        }

        .status-dot.error {
            background: #ff3333;
            box-shadow: 0 0 12px #ff3333, 0 0 25px #ff3333;
            animation: dot-blink 0.4s ease-in-out infinite;
        }

        @keyframes dot-blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.25;
            }
        }

        .status-text {
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* ============ 玻璃卡片 ============ */
        .glass-card {
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--glass-border);
            border-radius: 20px;
            padding: 32px 28px;
            position: relative;
            box-shadow: var(--card-shadow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .glass-card:hover {
            border-color: var(--glass-border-hover);
            box-shadow: 0 0 45px rgba(0, 240, 255, 0.25), 0 0 80px rgba(255, 0, 229, 0.12), inset 0 0 30px rgba(0, 240, 255, 0.05);
            transform: translateY(-3px);
        }

        /* 卡片边角装饰 */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 35px;
            height: 35px;
            border-top: 3px solid var(--neon-cyan);
            border-left: 3px solid var(--neon-cyan);
            border-radius: 20px 0 0 0;
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        .glass-card::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 35px;
            height: 35px;
            border-bottom: 3px solid var(--neon-pink);
            border-right: 3px solid var(--neon-pink);
            border-radius: 0 0 20px 0;
            opacity: 0.8;
            transition: all 0.3s ease;
        }
        .glass-card:hover::before {
            width: 55px;
            height: 55px;
            opacity: 1;
        }
        .glass-card:hover::after {
            width: 55px;
            height: 55px;
            opacity: 1;
        }

        /* ============ 信息行 ============ */
        .info-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid rgba(0, 240, 255, 0.12);
            gap: 16px;
            flex-wrap: wrap;
            transition: all 0.3s ease;
        }
        .info-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .info-row:hover {
            background: rgba(0, 240, 255, 0.03);
            padding-left: 10px;
            padding-right: 10px;
            border-radius: 8px;
            margin-left: -10px;
            margin-right: -10px;
        }

        .info-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            white-space: nowrap;
            min-width: 100px;
        }

        .info-label .label-icon {
            font-size: 1.1rem;
            filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.5));
            animation: icon-pulse 2s ease-in-out infinite;
        }

        @keyframes icon-pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        .info-value {
            font-size: clamp(0.9rem, 2vw, 1.15rem);
            font-weight: 700;
            font-family: var(--font-mono);
            letter-spacing: 0.04em;
            color: var(--text-primary);
            text-align: right;
            word-break: break-all;
            flex: 1;
            min-width: 150px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
            transition: all 0.3s ease;
            position: relative;
        }

        /* IP 地址特殊高亮 */
        .ip-value {
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            font-weight: 900;
            color: var(--neon-cyan);
            text-shadow:
                0 0 10px rgba(0, 240, 255, 0.7),
                0 0 30px rgba(0, 240, 255, 0.4),
                0 0 60px rgba(0, 240, 255, 0.2);
            letter-spacing: 0.06em;
            animation: ip-glow 2.5s ease-in-out infinite;
        }

        @keyframes ip-glow {
            0%,
            100% {
                text-shadow: 0 0 10px rgba(0, 240, 255, 0.7), 0 0 30px rgba(0, 240, 255, 0.4), 0 0 60px rgba(0, 240, 255, 0.2);
            }
            50% {
                text-shadow: 0 0 18px rgba(0, 240, 255, 0.9), 0 0 45px rgba(0, 240, 255, 0.6), 0 0 80px rgba(0, 240, 255, 0.35);
            }
        }

        /* 属地高亮 */
        .location-value {
            color: var(--neon-pink);
            text-shadow: 0 0 12px rgba(255, 0, 229, 0.5), 0 0 30px rgba(255, 0, 229, 0.25);
            font-weight: 800;
        }

        /* ============ 骨架加载状态 ============ */
        .skeleton {
            display: inline-block;
            background: linear-gradient(90deg,
                    rgba(0, 240, 255, 0.08) 25%,
                    rgba(0, 240, 255, 0.2) 50%,
                    rgba(0, 240, 255, 0.08) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 4px;
            color: transparent !important;
            text-shadow: none !important;
            min-width: 100px;
            min-height: 1em;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* ============ 刷新按钮 ============ */
        .refresh-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: rgba(0, 240, 255, 0.08);
            border: 1.5px solid var(--glass-border);
            border-radius: 50px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: var(--font-display);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .refresh-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
            z-index: -1;
        }

        .refresh-btn:hover {
            border-color: var(--glass-border-hover);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3), 0 0 60px rgba(0, 240, 255, 0.1);
            transform: translateY(-2px);
            color: var(--neon-cyan);
        }

        .refresh-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .refresh-btn:active {
            transform: translateY(0) scale(0.96);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .refresh-btn .btn-icon {
            font-size: 1.2rem;
            transition: transform 0.4s ease;
            display: inline-block;
        }
        .refresh-btn:hover .btn-icon {
            transform: rotate(180deg);
        }

        /* ============ 底部提示 ============ */
        .footer-note {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-align: center;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }
        .footer-note:hover {
            opacity: 1;
        }

        /* ============ 响应式设计 ============ */
        @media (max-width: 480px) {
            .glass-card {
                padding: 22px 18px;
                border-radius: 15px;
            }
            .glass-card::before,
            .glass-card::after {
                width: 25px;
                height: 25px;
                border-radius: 15px 0 0 0;
            }
            .glass-card::after {
                border-radius: 0 0 15px 0;
            }
            .info-row {
                flex-direction: column;
                gap: 6px;
                padding: 12px 0;
            }
            .info-value {
                text-align: left;
                font-size: 0.85rem;
            }
            .ip-value {
                font-size: 1.1rem;
            }
            .info-label {
                min-width: auto;
            }
            .refresh-btn {
                padding: 12px 24px;
                font-size: 0.8rem;
            }
            .subtitle::before,
            .subtitle::after {
                width: 20px;
            }
        }

        @media (min-width: 768px) {
            .glass-card {
                padding: 38px 36px;
            }
        }

        /* ============ 打字机光标效果 ============ */
        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--neon-cyan);
            margin-left: 4px;
            vertical-align: middle;
            animation: cursor-blink 1s step-end infinite;
        }

        @keyframes cursor-blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- 背景粒子画布 -->
    <canvas id="particles-canvas"></canvas>

    <!-- 网格背景 -->
    <div class="grid-overlay"></div>

    <!-- 扫描线 -->
    <div class="scanline"></div>

    <!-- 主内容 -->
    <div class="main-container">
        <!-- 标题区域 -->
        <header class="header-section">
            <div class="title-wrapper">
                <div class="title-icon">🌐</div>
                <h1 class="main-title">IP 探测器</h1>
            </div>
            <p class="subtitle">Network Intelligence System</p>
            <div class="status-bar">
                <span class="status-dot loading" id="statusDot"></span>
                <span class="status-text" id="statusText">正在连接卫星...</span>
            </div>
        </header>

        <!-- 信息卡片 -->
        <div class="glass-card" id="infoCard">
            <!-- IP 地址 -->
            <div class="info-row">
                <span class="info-label">
                    <span class="label-icon">📡</span>
                    IP 地址
                </span>
                <span class="info-value ip-value skeleton" id="ipValue">加载中...</span>
            </div>

            <!-- 所属国家/地区 -->
            <div class="info-row">
                <span class="info-label">
                    <span class="label-icon">🏳️</span>
                    国家 / 地区
                </span>
                <span class="info-value location-value skeleton" id="countryValue">加载中...</span>
            </div>

            <!-- 城市 -->
            <div class="info-row">
                <span class="info-label">
                    <span class="label-icon">🏙️</span>
                    城市
                </span>
                <span class="info-value skeleton" id="cityValue">加载中...</span>
            </div>

            <!-- ISP 运营商 -->
            <div class="info-row">
                <span class="info-label">
                    <span class="label-icon">📶</span>
                    运营商
                </span>
                <span class="info-value skeleton" id="ispValue">加载中...</span>
            </div>

            <!-- 经纬度 -->
            <div class="info-row">
                <span class="info-label">
                    <span class="label-icon">📍</span>
                    经纬度
                </span>
                <span class="info-value skeleton" id="coordsValue">加载中...</span>
            </div>

            <!-- 时区 -->
            <div class="info-row">
                <span class="info-label">
                    <span class="label-icon">🕐</span>
                    时区
                </span>
                <span class="info-value skeleton" id="timezoneValue">加载中...</span>
            </div>
        </div>

        <!-- 刷新按钮 -->
        <button class="refresh-btn" id="refreshBtn" title="重新获取IP信息">
            <span class="btn-icon">🔄</span>
            <span>重新扫描</span>
        </button>

        <!-- 底部提示 -->
        <p class="footer-note">
            ⚡ 数据来源: ip-api.com &nbsp;|&nbsp; 实时探测 &nbsp;|&nbsp; 安全加密
        </p>
    </div>

    <script>
        (function() {
            'use strict';

            // ============ DOM 元素引用 ============
            const elements = {
                ip: document.getElementById('ipValue'),
                country: document.getElementById('countryValue'),
                city: document.getElementById('cityValue'),
                isp: document.getElementById('ispValue'),
                coords: document.getElementById('coordsValue'),
                timezone: document.getElementById('timezoneValue'),
                statusDot: document.getElementById('statusDot'),
                statusText: document.getElementById('statusText'),
                refreshBtn: document.getElementById('refreshBtn'),
                card: document.getElementById('infoCard'),
            };

            // ============ 粒子系统 ============
            class ParticleSystem {
                constructor(canvas) {
                    this.canvas = canvas;
                    this.ctx = canvas.getContext('2d');
                    this.particles = [];
                    this.mouse = { x: null, y: null, radius: 120 };
                    this.resize();
                    this.initParticles();
                    this.bindEvents();
                    this.animate();
                }

                resize() {
                    this.width = this.canvas.width = window.innerWidth;
                    this.height = this.canvas.height = window.innerHeight;
                }

                initParticles() {
                    const particleCount = Math.min(120, Math.floor((this.width * this.height) / 12000));
                    this.particles = [];
                    for (let i = 0; i < particleCount; i++) {
                        this.particles.push(this.createParticle(true));
                    }
                }

                createParticle(randomY = false) {
                    return {
                        x: Math.random() * this.width,
                        y: randomY ? Math.random() * this.height : this.height + 10,
                        size: Math.random() * 2.5 + 0.8,
                        speedX: (Math.random() - 0.5) * 0.5,
                        speedY: -(Math.random() * 0.7 + 0.25),
                        opacity: Math.random() * 0.55 + 0.25,
                        color: this.getRandomColor(),
                        twinkleSpeed: Math.random() * 0.02 + 0.005,
                        twinklePhase: Math.random() * Math.PI * 2,
                    };
                }

                getRandomColor() {
                    const colors = [
                        '0, 240, 255', // cyan
                        '255, 0, 229', // pink
                        '139, 92, 246', // purple
                        '57, 255, 20', // green
                        '255, 215, 0', // gold
                    ];
                    return colors[Math.floor(Math.random() * colors.length)];
                }

                bindEvents() {
                    window.addEventListener('resize', () => this.resize());
                    window.addEventListener('mousemove', (e) => {
                        this.mouse.x = e.clientX;
                        this.mouse.y = e.clientY;
                    });
                    window.addEventListener('mouseleave', () => {
                        this.mouse.x = null;
                        this.mouse.y = null;
                    });
                    // 触摸支持
                    window.addEventListener('touchmove', (e) => {
                        if (e.touches.length > 0) {
                            this.mouse.x = e.touches[0].clientX;
                            this.mouse.y = e.touches[0].clientY;
                        }
                    });
                    window.addEventListener('touchend', () => {
                        this.mouse.x = null;
                        this.mouse.y = null;
                    });
                }

                animate() {
                    this.ctx.clearRect(0, 0, this.width, this.height);

                    // 连接线
                    this.drawConnections();

                    // 粒子
                    for (let i = 0; i < this.particles.length; i++) {
                        const p = this.particles[i];

                        // 更新位置
                        p.x += p.speedX;
                        p.y += p.speedY;
                        p.twinklePhase += p.twinkleSpeed;
                        p.currentOpacity = p.opacity * (0.6 + 0.4 * Math.sin(p.twinklePhase));

                        // 鼠标交互
                        if (this.mouse.x !== null && this.mouse.y !== null) {
                            const dx = p.x - this.mouse.x;
                            const dy = p.y - this.mouse.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < this.mouse.radius) {
                                const force = (this.mouse.radius - dist) / this.mouse.radius;
                                const angle = Math.atan2(dy, dx);
                                p.x += Math.cos(angle) * force * 2;
                                p.y += Math.sin(angle) * force * 2;
                            }
                        }

                        // 边界检查
                        if (p.y < -10 || p.x < -10 || p.x > this.width + 10) {
                            this.particles[i] = this.createParticle(false);
                            continue;
                        }

                        // 绘制粒子
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        this.ctx.fillStyle = `rgba(${p.color}, ${p.currentOpacity})`;
                        this.ctx.fill();

                        // 光晕
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.size * 2.8, 0, Math.PI * 2);
                        const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.8);
                        gradient.addColorStop(0, `rgba(${p.color}, ${p.currentOpacity * 0.5})`);
                        gradient.addColorStop(1, `rgba(${p.color}, 0)`);
                        this.ctx.fillStyle = gradient;
                        this.ctx.fill();
                    }

                    requestAnimationFrame(() => this.animate());
                }

                drawConnections() {
                    const maxDist = 140;
                    for (let i = 0; i < this.particles.length; i++) {
                        for (let j = i + 1; j < this.particles.length; j++) {
                            const p1 = this.particles[i];
                            const p2 = this.particles[j];
                            const dx = p1.x - p2.x;
                            const dy = p1.y - p2.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);

                            if (dist < maxDist) {
                                const alpha = (1 - dist / maxDist) * 0.25;
                                this.ctx.beginPath();
                                this.ctx.moveTo(p1.x, p1.y);
                                this.ctx.lineTo(p2.x, p2.y);
                                this.ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
                                this.ctx.lineWidth = 0.6;
                                this.ctx.stroke();
                            }
                        }
                    }
                }
            }

            // 初始化粒子系统
            const particleCanvas = document.getElementById('particles-canvas');
            const particleSystem = new ParticleSystem(particleCanvas);

            // ============ IP 信息获取 ============
            const API_URL = 'http://ip-api.com/json/?fields=status,message,country,countryCode,region,regionName,city,zip,lat,lon,timezone,isp,org,as,query,reverse,mobile,proxy,hosting';

            // 备用API列表
            const API_FALLBACKS = [
                'http://ip-api.com/json/?fields=status,message,country,countryCode,region,regionName,city,zip,lat,lon,timezone,isp,org,as,query,reverse,mobile,proxy,hosting',
                'https://ipapi.co/json/',
                'https://ipwho.is/'
            ];

            let currentApiIndex = 0;
            let isFetching = false;

            function setStatus(state, text) {
                elements.statusDot.className = 'status-dot';
                if (state === 'loading') {
                    elements.statusDot.classList.add('loading');
                } else if (state === 'error') {
                    elements.statusDot.classList.add('error');
                } else if (state === 'success') {
                    // 默认绿色
                }
                elements.statusText.textContent = text;
            }

            function setSkeleton(show) {
                const values = [elements.ip, elements.country, elements.city, elements.isp, elements.coords, elements.timezone];
                values.forEach(el => {
                    if (show) {
                        el.classList.add('skeleton');
                        el.textContent = '加载中...';
                    } else {
                        el.classList.remove('skeleton');
                    }
                });
            }

            function displayData(data) {
                // IP 地址
                elements.ip.textContent = data.query || data.ip || '未知';
                elements.ip.classList.remove('skeleton');

                // 国家
                const countryStr = [
                    data.country || '',
                    data.countryCode ? `(${data.countryCode})` : ''
                ].filter(Boolean).join(' ');
                elements.country.textContent = countryStr || '未知';
                elements.country.classList.remove('skeleton');

                // 城市
                const cityStr = [
                    data.city || '',
                    data.regionName || ''
                ].filter(Boolean).join(', ');
                elements.city.textContent = cityStr || '未知';
                elements.city.classList.remove('skeleton');

                // 运营商
                const ispStr = data.isp || data.org || data.as || '未知';
                elements.isp.textContent = ispStr;
                elements.isp.classList.remove('skeleton');

                // 经纬度
                if (data.lat !== undefined && data.lon !== undefined) {
                    elements.coords.textContent = `${data.lat.toFixed(4)}, ${data.lon.toFixed(4)}`;
                } else if (data.latitude !== undefined && data.longitude !== undefined) {
                    elements.coords.textContent = `${data.latitude.toFixed(4)}, ${data.longitude.toFixed(4)}`;
                } else {
                    elements.coords.textContent = '未知';
                }
                elements.coords.classList.remove('skeleton');

                // 时区
                elements.timezone.textContent = data.timezone || '未知';
                elements.timezone.classList.remove('skeleton');

                // 状态更新
                setStatus('success', '连接成功 · 数据已加密');
            }

            function handleError(message) {
                elements.ip.textContent = '获取失败';
                elements.country.textContent = '获取失败';
                elements.city.textContent = '获取失败';
                elements.isp.textContent = '获取失败';
                elements.coords.textContent = '获取失败';
                elements.timezone.textContent = '获取失败';

                document.querySelectorAll('.info-value').forEach(el => el.classList.remove('skeleton'));
                setStatus('error', `连接异常: ${message || '未知错误'}`);
            }

            async function fetchWithTimeout(url, timeout = 8000) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeout);
                try {
                    const response = await fetch(url, {
                        signal: controller.signal,
                        headers: { 'Accept': 'application/json' }
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    return data;
                } finally {
                    clearTimeout(timeoutId);
                }
            }

            async function fetchIpInfo() {
                if (isFetching) return;
                isFetching = true;
                setStatus('loading', '正在连接卫星...');
                setSkeleton(true);

                let lastError = null;

                for (let i = 0; i < API_FALLBACKS.length; i++) {
                    try {
                        const data = await fetchWithTimeout(API_FALLBACKS[i]);

                        // 处理不同API的返回格式
                        if (data.status === 'fail') {
                            throw new Error(data.message || '查询失败');
                        }

                        if (data.query || data.ip || data.success !== false) {
                            displayData(data);
                            isFetching = false;
                            return;
                        }

                        if (data.success === false) {
                            throw new Error(data.message || '查询失败');
                        }

                        // 如果数据无效，尝试下一个
                        if (!data.query && !data.ip) {
                            throw new Error('无效的响应数据');
                        }

                        displayData(data);
                        isFetching = false;
                        return;
                    } catch (err) {
                        lastError = err;
                        console.warn(`API ${i + 1} 失败:`, err.message);
                        // 继续尝试下一个API
                    }
                }

                // 所有API都失败
                handleError(lastError?.message || '所有API均不可用');
                isFetching = false;
            }

            // ============ 事件监听 ============
            elements.refreshBtn.addEventListener('click', () => {
                fetchIpInfo();
                // 按钮动画
                elements.refreshBtn.style.transform = 'scale(0.94)';
                setTimeout(() => {
                    elements.refreshBtn.style.transform = '';
                }, 150);
            });

            // 键盘快捷键：R键刷新
            window.addEventListener('keydown', (e) => {
                if (e.key === 'r' || e.key === 'R') {
                    if (!e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        fetchIpInfo();
                    }
                }
            });

            // 页面加载完成后自动获取
            window.addEventListener('DOMContentLoaded', () => {
                // 延迟一点让动画先播放
                setTimeout(() => {
                    fetchIpInfo();
                }, 600);
            });

            // 页面可见性变化时，重新获取（可选）
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && !isFetching) {
                    // 只在页面重新可见且超过10秒后刷新
                    const lastFetchTime = window._lastFetchTime || 0;
                    if (Date.now() - lastFetchTime > 10000) {
                        fetchIpInfo();
                    }
                }
            });

            // 记录上次获取时间
            const originalFetch = fetchIpInfo;
            fetchIpInfo = async function() {
                window._lastFetchTime = Date.now();
                return originalFetch.apply(this, arguments);
            };

            // 控制台欢迎信息
            console.log('%c🌐 IP 探测器已启动', 'font-size:18px; color:#00f0ff; font-weight:bold;');
            console.log('%c按 R 键快速刷新IP信息', 'font-size:12px; color:#8899cc;');

        })();
    </script>
</body>
</html>
